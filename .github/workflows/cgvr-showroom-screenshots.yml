name: Capture browser showroom screenshots

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cgvr-showroom-screenshots.yml'
      - 'docs/scripts/capture-showroom.cjs'
      - 'CASE STUDY CIE3/mobile-web/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9eaf0 # v4.2.2
      - name: Install pinned Chromium tooling
        run: |
          npm install --no-audit --no-fund --no-save --prefix .ci_tools playwright@1.56.1
          .ci_tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Serve local app
        run: |
          python3 -m http.server 8000 --directory "CASE STUDY CIE3/mobile-web" >/tmp/cgvr-http.log 2>&1 &
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/ >/dev/null
      - name: Capture screenshots and check browser state
        run: node docs/scripts/capture-showroom.cjs
      - name: Commit verified screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/ docs/BROWSER_SCREENSHOTS.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: commit Chromium showroom screenshots [skip ci]"
            git push
          fi
